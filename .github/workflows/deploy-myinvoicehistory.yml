name: Deploy MyInvoiceHistory to Azure

on:
  push:
    paths:
      - 'MyInvoiceHistory/**'
    branches:
      - 401smtp  # Change if you are using a different branch
  workflow_dispatch:  # Allows manual execution from GitHub UI

permissions:
  contents: read   # ✅ Required for repository access

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Publish MyInvoiceHistory
        run: |
          cd MyInvoiceHistory
          dotnet publish -c Release -o ./publish

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v2
        with:
          app-name: MyInvoiceHistoryApp  # Replace with your Azure App Service name
          slot-name: production
          package: MyInvoiceHistory/publish
