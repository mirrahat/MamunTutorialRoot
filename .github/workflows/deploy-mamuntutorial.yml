name: Deploy MamunTutorial to Azure

on:
  push:
    paths:
      - 'MamunTutorial/**'
    branches:
      - 401smtp  # Ensuring deployment happens only on 401smtp
  workflow_dispatch:  # Enables the "Run Workflow" button in GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Publish App
        run: |
          cd MamunTutorial
          dotnet publish -c Release -o ./publish

      - name: Login to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v2
        with:
          app-name: MyAspNetBackend  # Replace with your actual Azure App Service name
          slot-name: production
          package: MamunTutorial/publish
