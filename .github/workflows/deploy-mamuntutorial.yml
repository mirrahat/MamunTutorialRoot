name: Deploy MamunTutorial to Azure

on:
  push:
    paths:
      - 'MamunTutorial/**'
    branches:
      - 401smtp  # Ensuring deployment happens only on 401smtp

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Publish App
        run: |
          cd MamunTutorial
          dotnet publish -c Release -o ./publish

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v2
        with:
          app-name: MyAspNetBackend
          slot-name: production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: MamunTutorial/publish
